<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE TRAIN LIBRARY · 라시안컷</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0907;--panel:#15110c;--panel2:#1d1710;--gold:#e8b100;--gold2:#ffd766;--goldd:#8b6914;
  --cream:#f2e6c6;--mute:#a89a76;--line:rgba(232,177,0,.38);
  --serif:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --disp:'Cinzel','Times New Roman',serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--cream);
  font-family:var(--serif);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
.mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* buttons */
.btn{font-family:var(--mono);letter-spacing:.14em;font-size:13px;padding:12px 22px;background:transparent;color:var(--gold2);
  border:1px solid var(--gold);position:relative;transition:.2s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover:not(:disabled),.btn:active:not(:disabled){background:var(--gold);color:#120d04}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:7px 12px;font-size:11px}
.btn.danger{border-color:#b04a3a;color:#e59a8a}
.btn.danger:hover:not(:disabled){background:#b04a3a;color:#120d04}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--goldd)}

/* wipe transition */
#wipe{position:fixed;inset:0;z-index:150;display:flex;pointer-events:none;--d:.42s}
#wipe i{flex:1;background:linear-gradient(#0d0a06,#17110a);border-right:1px solid var(--line);
  transform:scaleY(0);transform-origin:top;transition:transform var(--d) cubic-bezier(.7,0,.3,1)}
#wipe i:nth-child(2){transition-delay:.03s}#wipe i:nth-child(3){transition-delay:.06s}#wipe i:nth-child(4){transition-delay:.09s}
#wipe i:nth-child(5){transition-delay:.12s}#wipe i:nth-child(6){transition-delay:.15s}#wipe i:nth-child(7){transition-delay:.18s}#wipe i:nth-child(8){transition-delay:.21s}
#wipe.cover{pointer-events:auto}
#wipe.cover i{transform:scaleY(1)}
#wipe.uncover i{transform:scaleY(0);transform-origin:bottom}
#wipe b{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:var(--disp);letter-spacing:.4em;color:var(--gold);
  font-size:14px;opacity:0;transition:opacity .25s .25s;transform:translateY(-50%)}
#wipe.cover b{opacity:.9}

/* INTRO */
#intro{align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#1c1409 0,#0a0907 65%)}
.step{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.step.on{display:flex;animation:stepIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.logowrap{position:relative;width:min(64vw,300px)}
.logowrap::before{content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(232,177,0,.22) 0,rgba(232,177,0,.08) 45%,rgba(232,177,0,0) 70%)}
.logo{position:relative;display:block;width:100%;height:auto}
@keyframes float{50%{transform:translate3d(0,-8px,0)}}
.title{font-family:var(--disp);font-size:clamp(20px,5.4vw,34px);letter-spacing:.32em;color:var(--gold2);margin:14px 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 26px}
.skip{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5}

.card{position:relative;width:min(92vw,430px);padding:26px 24px 20px;background:
  linear-gradient(160deg,#f1e3bd,#dcc78f 70%,#c9b073);color:#2a1d0a;border:1px solid #7a5b12;
  box-shadow:0 0 0 6px #0a0907,0 0 0 7px var(--gold),0 24px 60px rgba(0,0,0,.7);text-align:center}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(90,60,10,.55);pointer-events:none}
.card h2{font-family:var(--disp);letter-spacing:.3em;margin:4px 0 2px;font-size:22px;color:#3a2606}
.card .no{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#7a5b12}
.card p{margin:10px 0;line-height:1.75;font-size:14px}
.sigwrap{position:relative;margin:12px auto 6px;border-bottom:2px solid #3a2606;height:104px;background:rgba(255,255,255,.18)}
#sig{width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.sigwrap span{position:absolute;left:8px;top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#7a5b12;pointer-events:none}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:12px;position:relative;z-index:2}
.card .row .btn{min-height:44px}
.card .btn{color:#3a2606;border-color:#3a2606}
.card .btn:hover:not(:disabled){background:#3a2606;color:#f1e3bd}
.seal{position:absolute;right:16px;bottom:12px;width:74px;height:74px;border-radius:50%;opacity:0;transform:scale(2.4) rotate(-20deg);pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#ffd766,#8b6914 75%);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.seal img{width:58px;height:58px;border-radius:50%;background:#0a0907;object-fit:cover}
.card.signed .seal{animation:stamp .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-8deg)}}
.card.signed{animation:cardFly 1s 1.5s ease-in forwards}
@keyframes cardFly{to{transform:translateY(-120vh) rotate(6deg) scale(.6);opacity:0}}

#stepTrain{padding:0;justify-content:center;background:#050403}
#scene{width:100%;max-width:960px;height:auto;display:block}
.cap{position:absolute;bottom:calc(14% + env(safe-area-inset-bottom,0px));left:0;right:0;font-family:var(--mono);letter-spacing:.3em;color:var(--gold2);font-size:13px;text-align:center;min-height:20px}
#train1{animation:arrive 3.2s cubic-bezier(.15,.75,.2,1) both}
#train2{animation:depart 2.2s 7s cubic-bezier(.6,0,1,.6) forwards}
@keyframes arrive{from{transform:translateX(-860px)}to{transform:translateX(0)}}
@keyframes depart{to{transform:translateX(900px)}}
#doorL{animation:doorL 3.6s 3.2s ease-in-out both}
#doorR{animation:doorR 3.6s 3.2s ease-in-out both}
@keyframes doorL{0%{transform:translateX(0)}12%,86%{transform:translateX(-24px)}100%{transform:translateX(0)}}
@keyframes doorR{0%{transform:translateX(0)}12%,86%{transform:translateX(24px)}100%{transform:translateX(0)}}
#pax{animation:pax 3.2s 3.7s ease-in-out both;opacity:0}
@keyframes pax{0%{opacity:0;transform:translate(0,0)}10%{opacity:1;transform:translate(0,0)}64%{opacity:1;transform:translate(-118px,0)}92%,100%{opacity:0;transform:translate(-124px,-18px) scale(.82)}}
.puff{animation:puff 2.6s ease-out infinite;opacity:0}
.puff:nth-of-type(2){animation-delay:.9s}.puff:nth-of-type(3){animation-delay:1.7s}
@keyframes puff{0%{opacity:.6;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-30px,-70px) scale(2)}}
.lightcone{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.tstar{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

/* GAME */
#game{flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 20%,#17110a,#080706 70%)}
#hud{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
@media (max-width:520px){#modeTag{display:none}}
#hud .tt{font-family:var(--disp);letter-spacing:.24em;color:var(--gold);font-size:13px}
#stage{position:relative;width:min(100vw,calc((100dvh - 210px)*4/3),960px);aspect-ratio:4/3;border:1px solid var(--gold);
  box-shadow:0 0 0 5px #0a0907,0 0 0 6px var(--goldd),0 20px 60px rgba(0,0,0,.7)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;background:#000}
#prompt{position:absolute;left:50%;bottom:10px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s;
  background:rgba(10,9,7,.88);border:1px solid var(--gold);padding:6px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--gold2);white-space:nowrap}
#prompt.show{opacity:1;transform:translate(-50%,0)}
#hint{color:var(--mute);font-size:12px;margin:10px 0 0;font-family:var(--mono);letter-spacing:.1em;text-align:center}
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;padding:6px 26px;margin-top:auto;margin-bottom:12px}
@media (pointer:coarse),(max-width:820px){#pad{display:flex}#hint{display:none}}
.dpad{position:relative;width:150px;height:150px}
.dpad button{position:absolute;width:50px;height:50px;background:rgba(21,17,12,.9);border:1px solid var(--gold);color:var(--gold2);font-size:18px;touch-action:none}
.dpad .u{left:50px;top:0}.dpad .d{left:50px;top:100px}.dpad .l{left:0;top:50px}.dpad .r{left:100px;top:50px}
.dpad button:active,.dpad button.h{background:var(--gold);color:#120d04}
#abtn{width:86px;height:86px;border-radius:50%;background:rgba(21,17,12,.9);border:2px solid var(--gold);color:var(--gold2);font-family:var(--disp);font-size:26px;touch-action:none}
#abtn:active{background:var(--gold);color:#120d04}

/* OVERLAYS */
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#1c1409,#0a0907 70%)}
.ov.on{display:flex;animation:ovIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes ovIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.ovh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ovh h2{margin:0;font-family:var(--disp);letter-spacing:.2em;color:var(--gold2);font-size:clamp(15px,4vw,20px);flex:1;min-width:140px}
.ovb{flex:1;overflow:auto;padding:18px 16px 40px;max-width:940px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.shelfrow{display:flex;align-items:flex-end;gap:5px;padding:0 10px;min-height:118px;border-bottom:12px solid #2a1a0b;
  box-shadow:0 8px 0 -2px #120c05;background:linear-gradient(#0d0a06,#15100a);margin-bottom:22px;flex-wrap:nowrap;overflow-x:auto}
.spine{flex:0 0 auto;width:34px;border:0;border-top:3px solid var(--gold);border-bottom:3px solid var(--goldd);
  writing-mode:vertical-rl;text-orientation:mixed;padding:8px 0;font-family:var(--serif);font-size:12px;letter-spacing:.08em;color:var(--cream);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .25s;box-shadow:inset -3px 0 0 rgba(0,0,0,.35)}
.spine:hover,.spine.sel{transform:translateY(-12px)}
.spine.sel{color:var(--gold2);box-shadow:0 0 14px rgba(232,177,0,.5),inset -3px 0 0 rgba(0,0,0,.35)}
.detail{border:1px solid var(--line);background:var(--panel);padding:20px 20px 22px;position:relative;animation:fadeUp .45s both}
.detail::before,.detail::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold)}
.detail::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.detail::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.detail h3{margin:0 0 6px;font-family:var(--serif);font-size:22px;color:var(--gold2)}
.detail .body{white-space:pre-wrap;line-height:1.9;color:var(--cream);margin-top:12px;font-size:15px}
.detail .empty,.empty{color:var(--mute);font-style:italic}
.ctl{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view{animation:fadeUp .45s both}
.novel{display:flex;gap:14px;align-items:stretch;padding:16px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);width:100%;text-align:left;transition:.2s}
.novel:hover{border-color:var(--gold);transform:translateX(4px)}
.novel .bk{flex:0 0 54px;background:linear-gradient(135deg,#2a1b0b,#0c0a07);border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--disp);color:var(--gold);font-size:20px}
.novel h4{margin:0 0 4px;font-size:18px;color:var(--gold2)}
.novel p{margin:0;color:var(--mute);font-size:14px;line-height:1.6}
.chap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid rgba(232,177,0,.18);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;transition:.2s}
.chap:hover{background:rgba(232,177,0,.08);padding-left:22px}
.chap .n{font-family:var(--mono);color:var(--goldd);letter-spacing:.12em;margin-right:10px}
.reader{max-width:680px;margin:0 auto}
.reader h3{font-size:24px;color:var(--gold2);margin:4px 0 2px}
.reader .txt p{margin:0 0 1.1em;line-height:2;text-indent:1em}
.rnav{display:flex;justify-content:space-between;gap:8px;margin-top:30px}
.notice{border:1px dashed var(--goldd);color:var(--mute);padding:10px 14px;font-size:13px;margin-bottom:16px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:16px}
#modal.on{display:flex;animation:stepIn .35s}
.mbox{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--gold);padding:20px;user-select:text;-webkit-user-select:text}
.mbox h3{margin:0 0 14px;font-family:var(--disp);letter-spacing:.16em;color:var(--gold2);font-size:16px}
.mbox label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--goldd);margin:12px 0 4px}
.mbox input,.mbox textarea{width:100%;background:#0c0a07;border:1px solid var(--goldd);color:var(--cream);padding:10px;font:inherit;font-size:15px;line-height:1.7;resize:vertical}
.mbox input:focus,.mbox textarea:focus{outline:none;border-color:var(--gold2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:130;opacity:0;pointer-events:none;
  background:#120d04;border:1px solid var(--gold);padding:10px 18px;color:var(--gold2);font-size:14px;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.tstar,.puff,.lightcone{animation:none}}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- 화면 전환 (와이프 애니메이션) ---------- */
const wipe=$('#wipe');
async function transition(mid,fast){
  const d=fast?.28:.42;wipe.style.setProperty('--d',d+'s');
  wipe.className='cover';
  await sleep(d*1000+260);
  await mid();
  wipe.className='uncover';
  await sleep(d*1000+260);
  wipe.className='';
}
let mode='intro';
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}

/* ---------- 데이터 (Supabase) ---------- */
/* ▼▼ 여기 두 값만 본인 프로젝트 값으로 교체 (Supabase 대시보드 → Connect) ▼▼ */
const SUPABASE_URL='https://rvsknoatqorpaogdlldt.supabase.co';
const SUPABASE_KEY='sb_publishable_jVN2qVUHvLboDcKagFU4JA_UMnMsFDx';
/* ▲▲ Publishable 키(sb_publishable_...)는 공개되어도 안전합니다. 쓰기는 DB 권한(RLS)이 소유자만 허용합니다.
      secret 키 / service_role 키는 절대 넣지 마세요. (기존 anon 키도 그대로 사용 가능) ▲▲ */
let sb=null,db=null,isOwner=false,dbTried=false;
let lore=[],novels=[],chapters=[],unsubCh=null;
const CATS={
  core:{name:'세계의 근원',sub:'ORIGIN'},
  space:{name:'차원과 공간',sub:'DIMENSIONS'},
  races:{name:'종족과 존재',sub:'RACES'},
  leviathan:{name:'리바이어던',sub:'LEVIATHAN'},
  society:{name:'국가와 사회',sub:'SOCIETY'},
  planets:{name:'성체',sub:'PLANETS'}
};
const SHELF_CAT={a:'core',b:'space',c:'races',d:'leviathan',e:'society',f:'planets'};

const nowMs=()=>Date.now();
async function fetchLore(){
  const {data,error}=await sb.from('lore').select('*');if(error)throw error;
  return data.map(r=>({id:r.id,cat:r.cat,title:r.title,body:r.body,order:r.ord}));
}
async function fetchNovels(){
  const {data,error}=await sb.from('novels').select('*').order('created_at',{ascending:false});if(error)throw error;
  return data.map(r=>({id:r.id,title:r.title,summary:r.summary,createdAt:r.created_at}));
}
async function fetchChapters(novelId){
  const {data,error}=await sb.from('chapters').select('*').eq('novel_id',novelId).order('chapter_no',{ascending:true});if(error)throw error;
  return data.map(r=>({id:r.id,no:r.chapter_no,title:r.title,body:r.body}));
}
async function refreshLore(){try{lore=await fetchLore();}catch(e){toast('불러오기 실패: '+(e.message||e));}if($('#loreOv').classList.contains('on'))renderLore();}
async function refreshNovels(){try{novels=await fetchNovels();}catch(e){toast('불러오기 실패: '+(e.message||e));}if($('#libOv').classList.contains('on'))renderLib(false);}
async function refreshChapters(){
  const id=nv.novelId;if(!sb||!id){chapters=[];return;}
  try{const r=await fetchChapters(id);if(id===nv.novelId)chapters=r;}catch(e){toast('불러오기 실패: '+(e.message||e));}
  if($('#libOv').classList.contains('on')&&nv.view!=='list')renderLib(false);
}
function rerenderOpen(){
  if($('#loreOv').classList.contains('on'))renderLore();
  if($('#libOv').classList.contains('on'))renderLib(false);
}
function updateAuthBtn(){const b=$('#authBtn');if(b)b.textContent=isOwner?'로그아웃':'사서 로그인';}
async function checkOwner(){
  let o=false;
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){const r=await sb.rpc('is_owner');o=(r.data===true);}
  }catch(e){}
  const changed=(o!==isOwner);isOwner=o;updateAuthBtn();if(changed)rerenderOpen();
}
async function boot(){
  try{
    if(!/^https?:\/\//.test(SUPABASE_URL)||SUPABASE_URL.includes('YOUR-PROJECT')||!window.supabase)throw new Error('config');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    lore=await fetchLore();novels=await fetchNovels();
    db=sb;
    await checkOwner();
    sb.auth.onAuthStateChange(()=>{checkOwner();});
    sb.channel('tl-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'lore'},()=>refreshLore())
      .on('postgres_changes',{event:'*',schema:'public',table:'novels'},()=>refreshNovels())
      .on('postgres_changes',{event:'*',schema:'public',table:'chapters'},()=>refreshChapters())
      .subscribe();
  }catch(e){db=null;}
  dbTried=true;updateAuthBtn();rerenderOpen();
}
$('#authBtn').addEventListener('click',()=>{
  if(!sb){toast('저장소에 연결되지 않았습니다.');return;}
  if(isOwner){sb.auth.signOut().then(()=>{toast('로그아웃했습니다.');checkOwner();});return;}
  formModal('사서 로그인',[
    {key:'email',label:'EMAIL',type:'email'},
    {key:'pw',label:'PASSWORD',type:'password'}
  ],async v=>{
    const {error}=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.pw});
    if(error)throw new Error('로그인 실패: 이메일 또는 비밀번호를 확인하세요');
    await checkOwner();
    if(!isOwner){await sb.auth.signOut();throw new Error('사서 계정이 아닙니다');}
    toast('사서 로그인 완료');
  });
});

/* ---------- 폼 모달 ---------- */
function formModal(title,fields,onSave){
  const m=$('#modal'),box=$('#mbox');box.replaceChildren(h('h3',{text:title}));
  const inputs={};
  fields.forEach(f=>{
    const inp=f.area?h('textarea',{rows:f.rows||6}):h('input',{type:f.type||'text'});
    inp.value=f.value??'';inputs[f.key]=inp;
    box.append(h('label',{text:f.label}),inp);
  });
  const close=()=>m.classList.remove('on');
  const save=h('button',{class:'btn sm',text:'저장',onclick:async()=>{
    save.disabled=true;
    try{const v={};for(const k in inputs)v[k]=inputs[k].value;await onSave(v);close();}
    catch(e){toast((e.message||e.code||String(e)));save.disabled=false;}
  }});
  box.append(h('div',{class:'ctl'},save,h('button',{class:'btn sm',text:'취소',onclick:close})));
  m.classList.add('on');
  const first=box.querySelector('input,textarea');first&&first.focus();
}
function confirmModal(msg,onYes){
  const m=$('#modal'),box=$('#mbox');const close=()=>m.classList.remove('on');
  box.replaceChildren(h('h3',{text:'확인'}),h('p',{text:msg}),h('div',{class:'ctl'},
    h('button',{class:'btn sm danger',text:'삭제',onclick:async()=>{try{await onYes();close();}catch(e){toast('실패: '+(e.message||e.code||String(e)));}}}),
    h('button',{class:'btn sm',text:'취소',onclick:close})));
  m.classList.add('on');
}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on');});

/* ---------- 세계관 서가 ---------- */
let curCat='core',curLoreId=null;
const SPINE=['#3b1d12','#1f2a1e','#2a1b33','#4a3410','#1d2c3a','#40201f','#2f2f2f','#33260f'];
function noDbNotice(){return (dbTried&&!db)?h('div',{class:'notice',text:'저장소에 연결되지 않아 기록을 불러올 수 없습니다.'}):null;}
function renderLore(){
  const c=CATS[curCat];$('#loreTitle').textContent=c.name;$('#loreSub').textContent=c.sub;
  const body=$('#loreBody');const keep=body.scrollTop;body.replaceChildren();
  const nn=noDbNotice();nn&&body.append(nn);
  const items=lore.filter(x=>x.cat===curCat).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)||String(a.title).localeCompare(String(b.title),'ko'));
  if(!items.some(x=>x.id===curLoreId))curLoreId=items[0]?.id||null;
  if(!items.length){body.append(h('p',{class:'empty',text:'이 서가에는 아직 기록이 없습니다.'}));}
  else{
    const per=innerWidth<600?7:12;
    for(let i=0;i<items.length;i+=per){
      const row=h('div',{class:'shelfrow'});
      items.slice(i,i+per).forEach((it,k)=>{
        const ht=74+((i+k)*37%38);
        row.append(h('button',{class:'spine'+(it.id===curLoreId?' sel':''),title:it.title,text:it.title,
          style:`height:${ht}px;background:linear-gradient(90deg,${SPINE[(i+k)%SPINE.length]},#0c0a07)`,
          onclick:()=>{curLoreId=it.id;renderLore();}}));
      });
      body.append(row);
    }
    const it=items.find(x=>x.id===curLoreId);
    if(it){
      const d=h('div',{class:'detail',key:it.id},
        h('div',{class:'tag',text:c.sub+' · '+String(items.indexOf(it)+1).padStart(2,'0')}),
        h('h3',{text:it.title}),
        it.body?h('div',{class:'body',text:it.body}):h('div',{class:'body empty',text:'세부 설정이 아직 기록되지 않았습니다.'}));
      if(isOwner){
        d.append(h('div',{class:'ctl'},
          h('button',{class:'btn sm',text:'편집',onclick:()=>editLore(it)}),
          h('button',{class:'btn sm danger',text:'삭제',onclick:()=>confirmModal(`"${it.title}" 기록을 삭제합니다.`,async()=>{const {error}=await sb.from('lore').delete().eq('id',it.id);if(error)throw error;await refreshLore();})})));
      }
      body.append(d);
    }
  }
  if(isOwner&&db)body.append(h('div',{class:'ctl'},h('button',{class:'btn sm',text:'＋ 기록 추가',onclick:()=>editLore(null)})));
  body.scrollTop=keep;
}
function editLore(it){
  formModal(it?'기록 편집':'기록 추가',[
    {key:'title',label:'TITLE',value:it?.title},
    {key:'body',label:'CONTENT',value:it?.body,area:true,rows:10},
    {key:'order',label:'ORDER (숫자, 작을수록 앞)',value:it?.order??items_next()}
  ],async v=>{
    if(!v.title.trim())throw new Error('제목을 입력하세요');
    const data={cat:curCat,title:v.title.trim(),body:v.body,ord:Number(v.order)||0,updated_at:nowMs()};
    if(it){const {error}=await sb.from('lore').update(data).eq('id',it.id);if(error)throw error;}
    else{const {error}=await sb.from('lore').insert({id:curCat+'-'+nowMs().toString(36),...data});if(error)throw error;}
    await refreshLore();
  });
}
const items_next=()=>lore.filter(x=>x.cat===curCat).length+1;

/* ---------- 소설 서가 ---------- */
const nv={view:'list',novelId:null,chapterId:null};
function openChapters(id){chapters=[];if(!sb||!id)return;refreshChapters();}
function libGo(view,novelId,chapterId){
  if(novelId!==undefined&&novelId!==nv.novelId){nv.novelId=novelId;openChapters(novelId);}
  nv.view=view;if(chapterId!==undefined)nv.chapterId=chapterId;renderLib(true);
}
let fontSize=16;
function renderLib(animate){
  const body=$('#libBody');const oldScroll=body.scrollTop;
  const node=h('div',{class:animate?'view':''});
  const nn=noDbNotice();nn&&node.append(nn);
  const novel=novels.find(n=>n.id===nv.novelId);
  if(nv.view!=='list'&&!novel){nv.view='list';}
  if(nv.view==='list'){
    $('#libTitle').textContent='소설 서가';
    if(!novels.length)node.append(h('p',{class:'empty',text:'아직 서가에 꽂힌 소설이 없습니다.'}));
    novels.forEach(n=>node.append(h('button',{class:'novel',onclick:()=>libGo('novel',n.id)},
      h('div',{class:'bk',text:(n.title||'?').slice(0,1)}),
      h('div',{},h('h4',{text:n.title||'제목 없음'}),h('p',{text:n.summary||''})))));
    if(isOwner&&db)node.append(h('div',{class:'ctl'},h('button',{class:'btn sm',text:'＋ 새 소설 등록',onclick:()=>editNovel(null)})));
  }else if(nv.view==='novel'){
    $('#libTitle').textContent=novel.title;
    node.append(h('p',{class:'sub',style:'text-align:left;margin:0 0 16px;line-height:1.8',text:novel.summary||''}));
    if(!chapters.length)node.append(h('p',{class:'empty',text:'등록된 회차가 없습니다.'}));
    chapters.forEach(c=>{
      const b=h('button',{class:'chap',onclick:()=>libGo('read',undefined,c.id)},
        h('span',{},h('span',{class:'n',text:String(c.no).padStart(2,'0')}),c.title||'무제'),h('span',{class:'tag',text:'READ ▸'}));
      node.append(b);
    });
    if(isOwner&&db)node.append(h('div',{class:'ctl'},
      h('button',{class:'btn sm',text:'＋ 새 회차',onclick:()=>editChapter(null,novel)}),
      h('button',{class:'btn sm',text:'소설 정보 수정',onclick:()=>editNovel(novel)}),
      h('button',{class:'btn sm danger',text:'소설 삭제',onclick:()=>confirmModal(`"${novel.title}"과(와) 모든 회차를 삭제합니다.`,async()=>{
        const {error}=await sb.from('novels').delete().eq('id',novel.id);if(error)throw error;
        await refreshNovels();libGo('list',null);})})));
  }else{
    const idx=chapters.findIndex(c=>c.id===nv.chapterId);const c=chapters[idx];
    if(!c){nv.view='novel';return renderLib(animate);}
    $('#libTitle').textContent=novel.title;
    const txt=h('div',{class:'txt',style:`font-size:${fontSize}px`});
    String(c.body||'').split(/\n+/).forEach(p=>p.trim()&&txt.append(h('p',{text:p})));
    node.append(h('div',{class:'reader'},
      h('div',{class:'tag',text:'CHAPTER '+String(c.no).padStart(2,'0')}),
      h('h3',{text:c.title||'무제'}),
      h('div',{class:'ctl',style:'margin:8px 0 18px'},
        h('button',{class:'btn sm',text:'A−',onclick:()=>{fontSize=Math.max(13,fontSize-1);renderLib(false);}}),
        h('button',{class:'btn sm',text:'A+',onclick:()=>{fontSize=Math.min(26,fontSize+1);renderLib(false);}}),
        isOwner&&db?h('button',{class:'btn sm',text:'편집',onclick:()=>editChapter(c,novel)}):null,
        isOwner&&db?h('button',{class:'btn sm danger',text:'삭제',onclick:()=>confirmModal(`"${c.title}" 회차를 삭제합니다.`,async()=>{const {error}=await sb.from('chapters').delete().eq('id',c.id);if(error)throw error;await refreshChapters();libGo('novel');})}):null),
      txt,
      h('div',{class:'rnav'},
        h('button',{class:'btn sm',text:'◂ 이전 화',disabled:idx<=0,onclick:()=>libGo('read',undefined,chapters[idx-1].id)}),
        h('button',{class:'btn sm',text:'목록',onclick:()=>libGo('novel')}),
        h('button',{class:'btn sm',text:'다음 화 ▸',disabled:idx>=chapters.length-1,onclick:()=>libGo('read',undefined,chapters[idx+1].id)}))));
  }
  body.replaceChildren(node);
  body.scrollTop=animate?0:oldScroll;
}
function editNovel(n){
  formModal(n?'소설 정보 수정':'새 소설 등록',[
    {key:'title',label:'TITLE',value:n?.title},
    {key:'summary',label:'SUMMARY',value:n?.summary,area:true,rows:4}
  ],async v=>{
    if(!v.title.trim())throw new Error('제목을 입력하세요');
    if(n){const {error}=await sb.from('novels').update({title:v.title.trim(),summary:v.summary}).eq('id',n.id);if(error)throw error;}
    else{const {error}=await sb.from('novels').insert({title:v.title.trim(),summary:v.summary,created_at:nowMs()});if(error)throw error;}
    await refreshNovels();
  });
}
function editChapter(c,novel){
  const nextNo=chapters.reduce((m,x)=>Math.max(m,Number(x.no)||0),0)+1;
  formModal(c?'회차 편집':'새 회차 등록',[
    {key:'no',label:'NO.',value:c?.no??nextNo},
    {key:'title',label:'TITLE',value:c?.title},
    {key:'body',label:'BODY',value:c?.body,area:true,rows:14}
  ],async v=>{
    if(!v.title.trim())throw new Error('제목을 입력하세요');
    if(new TextEncoder().encode(v.body).length>240000)throw new Error('본문이 너무 깁니다. 회차를 나눠 주세요.');
    const data={chapter_no:Number(v.no)||nextNo,title:v.title.trim(),body:v.body,updated_at:nowMs()};
    if(c){const {error}=await sb.from('chapters').update(data).eq('id',c.id);if(error)throw error;}
    else{const {error}=await sb.from('chapters').insert({...data,novel_id:novel.id,created_at:nowMs()});if(error)throw error;}
    await refreshChapters();
  });
}

/* ---------- 오버레이 열고 닫기 ---------- */
async function openOv(id,prep){
  mode='overlay';
  await transition(async()=>{prep();$('#'+id).classList.add('on');},true);
}
async function closeOv(id){
  await transition(async()=>{$('#'+id).classList.remove('on');},true);
  mode='game';
}
function openLore(cat){curCat=cat;curLoreId=null;openOv('loreOv',renderLore);}
function openLib(){nv.view='list';nv.novelId=null;unsubCh&&unsubCh();openOv('libOv',()=>renderLib(false));}
document.querySelector('[data-close="lore"]').onclick=()=>closeOv('loreOv');
$('#libBack').onclick=()=>{
  if(nv.view==='read')libGo('novel');else if(nv.view==='novel')libGo('list',null);else closeOv('libOv');
};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on'))return $('#modal').classList.remove('on');
    if($('#loreOv').classList.contains('on'))closeOv('loreOv');
    else if($('#libOv').classList.contains('on'))$('#libBack').click();
  }
});

/* ---------- 인트로 ---------- */
function step(id){document.querySelectorAll('.step').forEach(s=>s.classList.toggle('on',s.id===id));}
let trainTimers=[],introDone=false;
$('#openInvite').onclick=()=>{step('stepInvite');setupSig();};
const sg=$('#sig'),sx=sg.getContext('2d');let strokes=0,drawing=false,lx=0,ly=0;
function setupSig(){
  const dpr=devicePixelRatio||1;sg.width=sg.clientWidth*dpr;sg.height=sg.clientHeight*dpr;
  sx.setTransform(dpr,0,0,dpr,0,0);sx.lineWidth=2.6;sx.lineCap='round';sx.lineJoin='round';sx.strokeStyle='#2a1a04';
  strokes=0;$('#sigOk').disabled=true;
}
const pos=e=>{const r=sg.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
sg.addEventListener('pointerdown',e=>{drawing=true;sg.setPointerCapture(e.pointerId);[lx,ly]=pos(e);sx.beginPath();sx.arc(lx,ly,1.2,0,7);sx.fill();});
sg.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);const lx0=lx,ly0=ly;sx.beginPath();sx.moveTo(lx,ly);sx.lineTo(x,y);sx.stroke();lx=x;ly=y;strokes+=Math.hypot(x-lx0,y-ly0);if(strokes>40)$('#sigOk').disabled=false;});
const endSig=()=>{drawing=false;};
sg.addEventListener('pointerup',endSig);sg.addEventListener('pointercancel',endSig);
$('#sigClear').onclick=()=>{sx.clearRect(0,0,sg.width,sg.height);strokes=0;$('#sigOk').disabled=true;};
$('#sigOk').onclick=()=>{
  $('#sigOk').disabled=true;$('#card').classList.add('signed');
  setTimeout(runTrain,2400);
};
function runTrain(){
  step('stepTrain');
  const svg=$('#scene'),cap=$('#cap');
  const clone=svg.cloneNode(true);svg.replaceWith(clone);clone.id='scene'; // 애니메이션 재시작
  const say=(t,ms)=>trainTimers.push(setTimeout(()=>cap.textContent=t,ms));
  say('열차가 도착합니다',300);say('승차하십시오',3600);say('출발합니다',6900);
  trainTimers.push(setTimeout(enterGame,8600));
}
async function enterGame(){
  if(introDone)return;introDone=true;trainTimers.forEach(clearTimeout);
  await transition(async()=>{showScreen('game');mode='game';resetPlayer();},false);
  toast('열차 도서관에 탑승했습니다');
}
$('#skipBtn').onclick=()=>{trainTimers.forEach(clearTimeout);enterGame();};

/* ---------- 맵 게임 ---------- */
const T=32,VW=12,VH=9,MW=24,MH=13;
const MAP=Array.from({length:MH},(_,r)=>Array.from({length:MW},(_,c)=>(r===0||r===MH-1||c===0||c===MW-1)?'#':'.'));
for(let c=1;c<MW-1;c++)MAP[1][c]='w';
const put=(c0,c1,r0,r1,ch)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)MAP[r][c]=ch;};
put(1,2,1,2,'a');put(4,5,1,2,'b');put(7,8,1,2,'c');put(10,11,1,2,'d');put(13,14,1,2,'e');put(16,17,1,2,'f');put(19,22,1,2,'n');
put(5,8,6,7,'k');put(15,18,6,7,'k');put(19,20,9,10,'t');put(11,12,12,12,'D');
const SOLID=new Set(['#','w','a','b','c','d','e','f','n','k','t','D']);
const LABEL={a:'세계의 근원 서가',b:'차원과 공간 서가',c:'종족과 존재 서가',d:'리바이어던 서가',e:'국가와 사회 서가',f:'성체 서가',n:'소설 서가',t:'사서의 책상',D:'열차에서 내리기',w:'창밖',k:'탁자'};
const cv=$('#cv'),g=cv.getContext('2d');
let S=1;
function fitCanvas(){
  const dpr=window.devicePixelRatio||1;
  const availCss=Math.max(240,Math.min(innerWidth,(innerHeight-210)*4/3,960));
  S=Math.max(1,Math.floor(availCss*dpr/(VW*T)));
  const W=VW*T*S/dpr,H=VH*T*S/dpr;
  cv.width=VW*T*S;cv.height=VH*T*S;
  cv.style.width=W+'px';cv.style.height=H+'px';
  const st=$('#stage');st.style.aspectRatio='auto';st.style.width=(W+2)+'px';st.style.height=(H+2)+'px';
  g.setTransform(S,0,0,S,0,0);g.imageSmoothingEnabled=false;
}
fitCanvas();
addEventListener('resize',fitCanvas);addEventListener('orientationchange',()=>setTimeout(fitCanvas,200));
const P={c:11,r:11,x:0,y:0,dir:'down',moving:false,fx:0,fy:0,tx:0,ty:0,p:0,walk:0};
function resetPlayer(){Object.assign(P,{c:11,r:11,x:11*T,y:11*T,dir:'down',moving:false,p:0});}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const held=[];const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
const press=d=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);held.push(d);};
const release=d=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);};
addEventListener('keydown',e=>{
  if(mode!=='game')return;
  if(keyMap[e.key]){press(keyMap[e.key]);e.preventDefault();}
  else if(['z','Z','Enter',' ','e','E'].includes(e.key)){e.preventDefault();if(!e.repeat)interact();}
});
addEventListener('keyup',e=>{if(keyMap[e.key])release(keyMap[e.key]);});
addEventListener('blur',()=>{held.length=0;});
document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(d);b.classList.add('h');});
  const up=()=>{release(d);b.classList.remove('h');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
$('#abtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='game')interact();});
const tileAt=(c,r)=>(MAP[r]&&MAP[r][c])||'#';
const facing=()=>{const [dx,dy]=DIRS[P.dir];return {c:P.c+dx,r:P.r+dy};};
function interact(){
  if(P.moving)return;
  const f=facing(),t=tileAt(f.c,f.r);
  if(SHELF_CAT[t])openLore(SHELF_CAT[t]);
  else if(t==='n')openLib();
  else if(t==='t'){if(isOwner)openLib();else toast('사서의 책상입니다. 사서만 사용할 수 있습니다.');}
  else if(t==='D'){leaveTrain();}
  else if(t==='w')toast('창밖으로 불빛이 흘러간다.');
  else if(t==='k')toast('탁자 위에 오래된 촛대가 놓여 있다.');
}
async function leaveTrain(){
  mode='transition';
  await transition(async()=>{showScreen('intro');step('stepCover');introDone=false;$('#card').classList.remove('signed');},false);
  mode='intro';
}
function update(dt){
  if(!P.moving&&held.length){
    const d=held[held.length-1];P.dir=d;
    const [dx,dy]=DIRS[d];const nc=P.c+dx,nr=P.r+dy;
    if(!SOLID.has(tileAt(nc,nr))){P.moving=true;P.fx=P.x;P.fy=P.y;P.tx=nc*T;P.ty=nr*T;P.p=0;P.nc=nc;P.nr=nr;}
  }
  if(P.moving){
    P.p+=dt/150;P.walk+=dt/90;
    if(P.p>=1){P.p=1;P.moving=false;P.c=P.nc;P.r=P.nr;P.x=P.tx;P.y=P.ty;}
    else{P.x=P.fx+(P.tx-P.fx)*P.p;P.y=P.fy+(P.ty-P.fy)*P.p;}
  }
  const f=facing(),t=tileAt(f.c,f.r);const pr=$('#prompt');
  if(!P.moving&&LABEL[t]&&t!=='#'){pr.textContent='[A] '+LABEL[t];pr.classList.add('show');}else pr.classList.remove('show');
}
const rnd=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);};
const BOOKS=['#5a2a18','#2d4a2e','#3d2a55','#8b6914','#28455e','#6a2a2a','#4a4a4a','#b8860b'];
function drawTile(c,r,x,y,t){
  const ch=MAP[r][c];
  // floor
  if(ch!=='#'&&ch!=='w'){
    g.fillStyle=((c+r)%2)?'#1d150d':'#191109';g.fillRect(x,y,T,T);
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,y+(c%2?10:22),T,1);
    if(c>=9&&c<=14&&r>=3&&r<=10){
      g.fillStyle='#2e1a0e';g.fillRect(x,y,T,T);
      g.strokeStyle='#a67c00';g.lineWidth=2;g.beginPath();
      const inR=(cc,rr)=>cc>=9&&cc<=14&&rr>=3&&rr<=10;
      if(!inR(c-1,r)){g.moveTo(x+2,y);g.lineTo(x+2,y+T);}
      if(!inR(c+1,r)){g.moveTo(x+T-2,y);g.lineTo(x+T-2,y+T);}
      if(!inR(c,r-1)){g.moveTo(x,y+2);g.lineTo(x+T,y+2);}
      if(!inR(c,r+1)){g.moveTo(x,y+T-2);g.lineTo(x+T,y+T-2);}
      g.stroke();
      if((c+r)%2===0){g.fillStyle='rgba(232,177,0,.18)';g.fillRect(x+13,y+13,6,6);}
    }
  }
  if(ch==='#'){
    g.fillStyle='#120e09';g.fillRect(x,y,T,T);
    g.strokeStyle='rgba(232,177,0,.28)';g.lineWidth=1;g.strokeRect(x+.5,y+.5,T-1,T-1);
    g.fillStyle='#8b6914';g.fillRect(x+T/2-1,y+T/2-1,3,3);
  }else if(ch==='w'){
    g.fillStyle='#0b0a10';g.fillRect(x,y,T,T);
    g.fillStyle='rgba(255,215,102,.85)';
    for(let i=0;i<3;i++){const sx=((rnd(c,i)*T*3-t*(40+i*30))%(T*3)+T*3)%(T*3)-T;g.fillRect(x+sx%T,y+6+i*8,3+i,2);}
    g.fillStyle='#e8b100';g.fillRect(x,y,T,2);g.fillRect(x,y+T-2,T,2);
    if(rnd(c,9)>.5){g.fillStyle='rgba(255,215,102,.6)';g.fillRect(x+5+Math.floor(rnd(c,3)*20),y+5,2,2);}
  }else if('abcdefn'.includes(ch)){
    g.fillStyle='#2a1a0c';g.fillRect(x,y,T,T);
    g.fillStyle='#120b05';g.fillRect(x+2,y+2,T-4,T-4);
    for(let s=0;s<3;s++){
      const by=y+3+s*10;let bx=x+3;
      while(bx<x+T-5){
        const lx=bx-x,ly=3+s*10,k1=c*97+lx,k2=r*89+ly;
        const w=3+Math.floor(rnd(k1+c,k2+r)*3),hh=6+Math.floor(rnd(k2,k1)*3);
        g.fillStyle=ch==='n'?(rnd(k1,k2)>.4?'#c69a12':'#5a3f08'):BOOKS[Math.floor(rnd(k1*3,k2+c)*BOOKS.length)];
        g.fillRect(bx,by+9-hh,w,hh);bx+=w+1;
      }
      g.fillStyle='#4a2f14';g.fillRect(x+2,by+9,T-4,2);
    }
    g.strokeStyle='#e8b100';g.lineWidth=1;g.strokeRect(x+.5,y+.5,T-1,T-1);
  }else if(ch==='k'){
    g.fillStyle='#33231a';g.fillRect(x,y+2,T,T-4);g.strokeStyle='#a67c00';g.strokeRect(x+.5,y+2.5,T-1,T-5);
    if(c===6||c===17){
      const gl=g.createRadialGradient(x+T,y+T,2,x+T,y+T,40);gl.addColorStop(0,'rgba(255,215,102,.5)');gl.addColorStop(1,'rgba(255,215,102,0)');
      g.fillStyle=gl;g.fillRect(x-20,y-20,T+60,T+60);
      g.fillStyle='#ffd766';g.fillRect(x+T-2,y+T-8,4,4);g.fillStyle='#8b6914';g.fillRect(x+T-3,y+T-4,6,6);
    }
  }else if(ch==='t'){
    g.fillStyle='#2b1d10';g.fillRect(x,y,T,T);g.strokeStyle='#e8b100';g.strokeRect(x+.5,y+.5,T-1,T-1);
    g.fillStyle='#e9dcb2';if(c===19&&r===9)g.fillRect(x+8,y+10,14,10);
    if(c===20&&r===9){g.fillStyle='#8b6914';g.fillRect(x+10,y+14,8,8);g.fillStyle='#ffd766';g.fillRect(x+12,y+8,4,6);}
  }else if(ch==='D'){
    g.fillStyle='#3a2a10';g.fillRect(x,y,T,T);g.strokeStyle='#e8b100';g.lineWidth=2;g.strokeRect(x+2,y+2,T-4,T-4);
    g.fillStyle='#e8b100';g.fillRect(c===11?x+T-8:x+5,y+T/2,3,6);
  }
}
function drawPlayer(sx,sy){
  const b=P.moving?Math.abs(Math.sin(P.walk))*2:0;
  g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(sx+16,sy+28,8,3,0,0,7);g.fill();
  const y=sy-b;
  g.fillStyle='#0c0a07';g.fillRect(sx+10,y+13,12,12);           // coat
  g.fillStyle='#e8b100';g.fillRect(sx+10,y+13,12,1);g.fillRect(sx+15,y+14,2,10);
  g.fillStyle='#0c0a07';g.fillRect(sx+11,y+24,4,4);g.fillRect(sx+17,y+24,4,4);
  const arm=P.moving?Math.sin(P.walk)*2:0;
  g.fillStyle='#1a1408';g.fillRect(sx+8,y+14+arm,3,8);g.fillRect(sx+21,y+14-arm,3,8);
  g.fillStyle='#e8d3a8';g.fillRect(sx+11,y+6,10,8);                  // head
  if(P.dir==='down'){g.fillStyle='#000';g.fillRect(sx+13,y+9,2,2);g.fillRect(sx+17,y+9,2,2);}
  else if(P.dir==='left'){g.fillStyle='#000';g.fillRect(sx+12,y+9,2,2);}
  else if(P.dir==='right'){g.fillStyle='#000';g.fillRect(sx+18,y+9,2,2);}
  else{g.fillStyle='#2a1d0a';g.fillRect(sx+11,y+6,10,5);}
  g.fillStyle='#050403';g.fillRect(sx+8,y+5,16,3);                    // brim
  g.fillRect(sx+11,y-4,10,10);
  g.fillStyle='#e8b100';g.fillRect(sx+11,y+2,10,2);
}
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(mode==='game'||mode==='transition'){
    if(mode==='game')update(dt);
    const cx=Math.max(0,Math.min(MW*T-VW*T,P.x+T/2-VW*T/2)),cy=Math.max(0,Math.min(MH*T-VH*T,P.y+T/2-VH*T/2));
    const rs=v=>Math.round(v*S)/S;
    g.fillStyle='#000';g.fillRect(0,0,VW*T,VH*T);
    const t=now/1000;
    const c0=Math.floor(cx/T),r0=Math.floor(cy/T);
    for(let r=r0;r<=r0+VH&&r<MH;r++)for(let c=c0;c<=c0+VW&&c<MW;c++)drawTile(c,r,rs(c*T-cx),rs(r*T-cy),t);
    drawPlayer(rs(P.x-cx),rs(P.y-cy));
    // 램프 조명 비네트
    const px=P.x-cx+T/2,py=P.y-cy+T/2;
    const v=g.createRadialGradient(px,py,50,px,py,230);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');
    g.fillStyle=v;g.fillRect(0,0,VW*T,VH*T);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelector('.seal img').src=document.querySelector('.logo').src;
boot();
})();
</script>
